<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="XiloScan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2c4b"/><stop offset="1" stop-color="#0c1626"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eccb7d"/><stop offset="1" stop-color="#b98f36"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d488"/><stop offset="1" stop-color="#c99a3e"/>
    </linearGradient>
  </defs>

  <!-- fundo navy full-bleed (bom para maskable / apple-touch) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- copa -->
  <g fill="url(#goldSoft)">
    <circle cx="256" cy="166" r="50"/>
    <circle cx="210" cy="194" r="38"/>
    <circle cx="302" cy="194" r="38"/>
    <circle cx="234" cy="210" r="34"/>
    <circle cx="278" cy="210" r="34"/>
    <circle cx="256" cy="200" r="44"/>
  </g>
  <!-- tronco nasce da medula do corte -->
  <path d="M248 300 C247 274 243 244 250 206 L262 206 C269 244 265 274 264 300 C258 296 254 296 248 300 Z" fill="url(#gold)"/>

  <!-- corte transversal na base (o lenho que o app analisa) -->
  <ellipse cx="256" cy="324" rx="76" ry="25" fill="#0b1526" stroke="url(#gold)" stroke-width="8"/>
  <path d="M182 320 A76 25 0 0 1 330 320" fill="none" stroke="#f5e6bf" stroke-width="3" opacity=".55"/>
  <ellipse cx="256" cy="322" rx="50" ry="15" fill="none" stroke="#f2ead6" stroke-width="6" opacity=".92"/>
  <ellipse cx="256" cy="321" rx="26" ry="8" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="256" cy="320" r="4.5" fill="#f2ead6"/>

  <!-- escudo-hexágono ouro (família EFV Brasil) -->
  <path d="M256 100 L374 164 L374 302 L256 392 L138 302 L138 164 Z"
        fill="none" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
</svg>
